name: Continuous Deployment (CD) - Render

on:
  push:
    branches: [ "production" ]

jobs:
  deploy:
    name: Deploy to Render Platform
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not defined in GitHub repository secrets!"
            echo "Please configure RENDER_DEPLOY_HOOK_URL under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Triggering deployment on Render (production branch)..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Render HTTP Status: $HTTP_STATUS"
          echo "Render Response Payload: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment hook successfully triggered on production!"
          else
            echo "::error::Render deployment hook trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi
